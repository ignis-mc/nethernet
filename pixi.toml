[workspace]
name = "nethernet"
version = "0.1.0"
description = "NetherNet, Minecraft Bedrock's WebRTC data-channel transport, in pure Mojo"
authors = ["ignis-mc contributors"]
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/ignis-mc/nethernet"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
mojo = ">=1.2.0,<1.3.0"

[tasks]
test = { cmd = "bash scripts/run_tests.sh", description = "Run every unit test file" }
format = { cmd = "mojo format src test examples benchmarks", description = "Format all Mojo sources" }
format-check = { cmd = "bash scripts/check_format.sh", description = "Fail if formatting would change anything" }
lint-docs = { cmd = "mojo doc --diagnose-missing-doc-strings --Werror -o /dev/null src/nethernet", description = "Fail on missing or malformed docstrings" }
build = { cmd = "mkdir -p build && mojo precompile src/nethernet -o build/nethernet.mojoc", description = "Precompile the package" }
smoke = { cmd = "bash scripts/smoke_package.sh", depends-on = ["build"], description = "Import the precompiled package from a consumer program" }
examples = { cmd = "bash scripts/build_examples.sh", description = "Build the example programs into build/" }
bench = { cmd = "bash scripts/run_benchmarks.sh", description = "Run the benchmarks" }
check = { depends-on = ["format-check", "lint-docs", "smoke", "test"], description = "Everything CI runs except interop" }

# Interoperability tests against go-nethernet need a Go toolchain.
[feature.interop.dependencies]
go = ">=1.24"

[feature.interop.tasks]
interop = { cmd = "bash interop/run.sh", description = "Run the go-nethernet interop matrix" }

[environments]
interop = ["interop"]
